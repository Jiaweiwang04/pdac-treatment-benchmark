version: v0.1
status: draft_not_locked
task: track_a_patient_candidate_evidence_and_constraint_labeling
purpose: rank frozen candidate treatments using evidence and information available strictly before t0 without asserting a best treatment or clinical clearance

authoritative_inputs:
  cohort_definition:
    path: cohort_definition_v0.1.yaml
    required_version: v0.1.3.1
    required_status: draft_not_locked
  candidate_space:
    path: config/candidate_treatment_space_v0.1.yaml
    required_version: v0.1.1
    required_status: draft_not_locked
    candidate_pool: main_candidate_pool
  leakage_audit:
    path: reports/tables/time_leakage_field_audit.csv
  label_availability_audit:
    path: reports/tables/label_availability.csv

cohort_invariants:
  strict_extended_n: 557
  strict_core_n: 475
  cohort_membership_is_endpoint_independent: true
  schema_must_not_reselect_t0_or_rebuild_cohort: true

unit_of_analysis:
  grain: one_locked_pdac_t0_candidate_pair
  formal_key_fields: [cohort, record_id, ca_seq, candidate_id]
  required_context_fields: [t0_regimen_start_day, index_ngs_report_day, advanced_evidence_day]
  public_output_allowed: false
  patient_level_storage: data/processed/evidence_constraint_labels
  patient_level_storage_git_status: ignored

time_boundary:
  anchor: t0_regimen_start_day
  input_rule: information_must_be_available_strictly_before_t0
  index_ngs_rule: index_ngs_report_day < t0_regimen_start_day
  advanced_evidence_rule: advanced_evidence_day < t0_regimen_start_day
  prior_treatment_rule: prior_regimen_start_day < t0_regimen_start_day
  same_day_information_policy: not_available_for_main_track_a_label
  post_t0_information_policy: prohibited

label_families:
  observed_next_regimen:
    role: auxiliary_observational_proxy
    target_status: not_gold_standard
    allowed_uses: [descriptive_alignment, secondary_observed_choice_analysis]
    prohibited_uses: [evidence_label_source, best_treatment_target, model_input_at_t0]
  evidence_label:
    role: primary_benchmark_target
    source: frozen_candidate_evidence_and_pre_t0_track_a_context
    independent_of_observed_choice: true
    independent_of_post_t0_outcome: true
  outcome_label:
    role: secondary_endpoint_only
    allowed_endpoints: [os_post_t0_validated, pfs_i_post_t0_validated, pfs_m_post_t0_validated]
    prohibited_endpoints: [ttnt_any_cancer_not_t0_validated, ttnt_associated_cancer_not_t0_validated]
    prohibited_uses: [candidate_classification_target, evidence_label_source, best_treatment_target]

track_a_input_policy:
  allowed_groups:
    - locked_pdac_instance_mapping
    - advanced_status_strictly_pre_t0
    - selected_ngs_report_strictly_pre_t0
    - biomarker_results_available_from_selected_pre_t0_ngs
    - prior_treatment_components_strictly_pre_t0
    - prior_line_and_exposure_context_strictly_pre_t0
  prohibited_fields_or_groups:
    - cohort
    - record_id
    - ca_seq
    - patient_or_sample_identifiers
    - observed_next_regimen
    - t0_regimen_drugs
    - post_t0_regimen_or_line
    - os_pfs_ttnt_fields
    - death_or_last_alive_fields
    - follow_up_fields
    - future_ngs_or_biomarker_results
  identifier_policy: linkage_only_never_model_feature

track_b_policy:
  status: frozen
  unavailable_groups: [ecog, laboratory_values, organ_function, dose, dose_modification, toxicity, detailed_contraindications, drug_interactions]
  assessment_status: not_assessed_track_b_frozen
  relationship_to_track_a_label: separate_not_used_to_derive_track_a_label
  clinical_clearance_policy: never_infer_clearance_from_missing_track_b
  future_extension_policy: add_separate_versioned_axis_without_relabeling_missing_track_b_as_normal

missingness_policy:
  missing_is_not_negative: true
  missing_is_not_normal: true
  missing_is_not_no_contraindication: true
  missing_required_track_a_condition: unknown
  unknown_can_trigger_exclude: false
  explicit_pre_t0_contradiction_required_for_exclude: true

evidence_axis:
  field: evidence_status
  allowed_values: [supported, conditional, not_supported, insufficient_evidence]
  required_provenance_fields: [candidate_space_version, evidence_cutoff_date, evidence_source_ids]
  source_ids_must_exist_in_candidate_space: true
  observed_frequency_is_evidence: false
  outcome_association_is_evidence: false
  candidate_evidence_status_mapping:
    supported: [supported_by_accessible_sources]
    conditional: [supported_with_conflicting_or_lower_level_evidence, phase_3_no_overall_survival_benefit_with_pfs_or_response_signal]
    not_supported: []
    insufficient_evidence: []
  unmapped_main_candidate_status_policy: invalid_row

constraint_axis:
  field: track_a_constraint_status
  allowed_values: [satisfied, not_satisfied, unknown, not_applicable, manual_review]
  condition_types: [disease_scope, treatment_setting, line_of_therapy, prior_treatment, biomarker, assay, maintenance_role]
  required_condition_fields: [condition_id, condition_type, required, assessment, reason_code, source_candidate_field]
  hard_negative_condition_types: [disease_scope, treatment_setting, line_of_therapy, prior_treatment, biomarker]
  assay_unknown_policy: conditional_review
  manual_review_policy: conditional_review
  candidate_field_to_condition_type:
    disease.name: disease_scope
    candidate.treatment_setting: treatment_setting
    candidate.line_of_therapy: line_of_therapy
    candidate.prior_treatment_requirements: prior_treatment
    candidate.biomarker_requirements: biomarker
    candidate.maintenance_or_active_treatment: maintenance_role
  candidate_manual_review_flag_policy: does_not_automatically_lower_track_a_label_unless_track_a_condition_or_evidence_requires_review

clinical_clearance_axis:
  field: clinical_clearance_status
  allowed_values: [not_assessed_track_b_frozen, requires_clinical_review]
  default: not_assessed_track_b_frozen
  cleared_value_available_in_v0_1: false
  interpretation: this_schema_never_asserts_that_a_patient_is_clinically_fit_for_treatment

track_a_label:
  field: track_a_evidence_constraint_label
  allowed_values: [consider, conditional_review, exclude, insufficient_evidence]
  scope: evidence_and_track_a_applicability_only
  semantics:
    consider: evidence_supported_and_all_required_observable_track_a_conditions_satisfied_or_not_applicable
    conditional_review: conditional_evidence_or_required_track_a_information_unknown_or_manual_review_needed
    exclude: explicit_pre_t0_track_a_contradiction_or_evidence_explicitly_not_supported_for_the_context
    insufficient_evidence: candidate_evidence_is_insufficient_without_an_explicit_exclusion_basis
  interpretation_limits:
    - consider_is_not_a_treatment_recommendation
    - consider_is_not_clinical_clearance
    - exclude_is_not_derived_from_missing_data
    - labels_do_not_claim_the_unique_best_treatment
  ordered_derivation_rules:
    - priority: 1
      when: row_validity_is_not_valid
      action: do_not_emit_training_label
    - priority: 2
      when: any_required_hard_track_a_condition_is_not_satisfied
      action: exclude
    - priority: 3
      when: evidence_status_is_not_supported
      action: exclude
    - priority: 4
      when: evidence_status_is_insufficient_evidence
      action: insufficient_evidence
    - priority: 5
      when: evidence_status_is_conditional_or_any_required_track_a_condition_is_unknown_or_manual_review
      action: conditional_review
    - priority: 6
      when: evidence_status_is_supported_and_all_required_track_a_conditions_are_satisfied_or_not_applicable
      action: consider
  track_b_status_changes_track_a_label: false

candidate_policy_overrides:
  folfox_or_off:
    maximum_track_a_label: conditional_review
    reason: conflicting_phase_3_evidence_and_unresolved_regimen_context
  gemcitabine_paclitaxel_after_folfirinox:
    maximum_track_a_label: conditional_review
    reason: phase_3_no_overall_survival_benefit_and_higher_toxicity
  ntrk_fusion_targeted_therapy:
    output_granularity: class_only
    permitted_agents_are_mutually_exclusive: true
    selected_agent_output_allowed: false

row_validity:
  field: row_validity_status
  allowed_values: [valid, invalid_time_boundary, invalid_candidate_reference, invalid_cohort_reference, manual_data_review]
  training_eligible_value: valid
  invalid_rows_must_not_receive_track_a_label: true

provenance:
  required_fields:
    - schema_version
    - cohort_definition_version
    - candidate_space_version
    - evidence_cutoff_date
    - rule_set_version
    - label_origin
    - review_status
  label_origin_values: [rule_derived, manual_reviewed, adjudicated]
  review_status_values: [not_reviewed, single_review, double_review, adjudicated]
  all_reason_codes_must_be_machine_readable: true

patient_candidate_table_contract:
  creation_status: not_created_schema_only
  required_columns:
    - cohort
    - record_id
    - ca_seq
    - candidate_id
    - row_validity_status
    - evidence_status
    - evidence_source_ids
    - track_a_constraint_status
    - track_a_condition_assessments
    - track_b_assessment_status
    - track_a_evidence_constraint_label
    - clinical_clearance_status
    - reason_codes
    - observed_next_regimen_auxiliary
    - outcome_linkage_available
    - schema_version
    - candidate_space_version
    - evidence_cutoff_date
    - label_origin
    - review_status
  observed_next_regimen_auxiliary_is_model_target: false
  outcome_linkage_available_is_model_target: false

privacy:
  public_outputs: aggregate_only
  small_count_threshold: 5
  patient_level_outputs_git_ignored: true
  identifiers_in_logs_or_public_reports: prohibited
  pilot_row_exports_public: false

pilot_readiness:
  patient_level_labels_created: false
  pilot_size_range: [20, 30]
  pilot_must_remain_private: true
  required_coverage_strata:
    - evidence_supported_and_track_a_complete
    - evidence_conditional
    - biomarker_required_positive_negative_and_unknown_when_available
    - prior_treatment_requirement_satisfied_not_satisfied_and_unknown
    - manual_review_or_mapping_uncertainty
  acceptance_checks:
    - no_post_t0_input_fields
    - no_missing_as_negative
    - no_observed_regimen_as_gold_standard
    - no_outcome_optimized_label
    - all_candidate_and_evidence_references_valid
    - all_disagreements_recorded_without_exposing_patient_identifiers
