unresolved_decisions:
  - decision: confirm_main_pool_boundary_for_folfox_off_and_gemcitabine_paclitaxel
    alternatives: [retain_in_main_with_lower_level_evidence, move_to_extended_until_guideline_review]
    impact: changes whether lower_level later_line options are ranked in the primary candidate space
    recommendation: retain_in_main_for_v0_1_because_they_are_explicitly_discussed_in_nci_pdq_but_mark_manual_review
  - decision: split_ntrk_class_into_individual_agents
    alternatives: [keep_class_candidate, split_larotrectinib_entrectinib_repotrectinib]
    impact: affects candidate count and action selection granularity
    recommendation: keep_class_candidate until clinical review defines agent-selection rules
  - decision: confirm_current_guideline_role_of_gemcitabine_cisplatin_hrd
    alternatives: [retain_extended, promote_to_main]
    impact: affects HRD/platinum candidate coverage
    recommendation: retain_extended_pending_current_guideline_review
  - decision: verify_nccn_or_other_licensed_guideline_snapshot
    alternatives: [mentor_or_clinical_expert_legal_access_review, use_public_nci_and_fda_sources_only]
    impact: current guideline status cannot be claimed from inaccessible NCCN text
    recommendation: require_mentor_or_clinical_expert_review_before_lock
  - decision: verify_track_b_fields_and_endpoint_independence
    alternatives: [obtain_compliant_track_b_data, keep_track_b_frozen]
    impact: determines whether detailed clinical constraints can be labeled
    recommendation: keep_track_b_frozen
freeze_requirements:
  - mentor_or_clinical_expert_confirmation_of_candidate_granularity
  - legal_or_authorized_guideline_snapshot_review
  - confirmation_that_no_candidate_is_a_patient_level_prescription
  - confirmation_of_track_a_track_b_boundary
