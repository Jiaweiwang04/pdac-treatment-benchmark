version: v0.1
status: draft_not_locked
disease:
  name: advanced_pancreatic_ductal_adenocarcinoma
  population: unresectable_locally_advanced_recurrent_or_metastatic_pdac
  excluded_histologies: [acinar_cell_carcinoma, adenosquamous_carcinoma, neuroendocrine_tumor, other_non_pdac_pancreatic_subtype]
setting: advanced_pdac_systemic_treatment
evidence_cutoff_date: '2026-08-15'
track:
  track_a:
    status: conditional_go
    available_context: [pdac_instance, advanced_status, pre_t0_ngs, prior_treatment_history, observed_regimen_components, selected_biomarker_results_when_present]
    unavailable_or_unvalidated_context: [ecog, laboratory_values, organ_function, dose, dose_modification, toxicity, contraindication_detail]
  track_b:
    status: frozen
    required_for: [performance_status, laboratory_and_organ_function_constraints, toxicity_and_dose_constraints, detailed_contraindications]
candidate_granularity:
  principle: clinically_interpretable_data_mappable_and_sample_size_aware
  regimen_components_are_order_independent: true
  mfolfirinox_policy: merge_with_folfirinox_as_variant
  ordinary_and_liposomal_irinotecan_policy: keep_separate
  maintenance_and_active_treatment_policy: keep_separate
  single_agent_and_combination_policy: keep_separate
main_candidate_pool:
  - folfirinox
  - nalirifox
  - gemcitabine_nab_paclitaxel
  - gemcitabine_monotherapy
  - liposomal_irinotecan_fluorouracil_leucovorin
  - fluorouracil_leucovorin
  - folfox_or_off
  - gemcitabine_paclitaxel_after_folfirinox
  - olaparib_maintenance_brca
  - pembrolizumab_msi_h_dmmr
  - pembrolizumab_tmb_h
  - zenocutuzumab_nrg1_fusion
  - ntrk_fusion_targeted_therapy
  - selpercatinib_ret_fusion
  - dabrafenib_trametinib_braf_v600e
  - trastuzumab_deruxtecan_her2_positive
extended_candidate_pool:
  - gemcitabine_cisplatin_hrd
  - gemcitabine_capecitabine
  - capecitabine_monotherapy
  - gemcitabine_erlotinib
  - folfiri_or_irinotecan_fluoropyrimidine
  - gemcitabine_oxaliplatin
  - kras_g12c_targeted_therapy
  - other_actionable_biomarker_trial_or_label
  - clinical_trial_referral
  - evidence_insufficient_direct_treatment
  - masked_investigational_regimen_review
excluded_categories:
  - surgery_or_resection_decision
  - radiation_or_local_therapy_decision
  - supportive_care
  - dose_or_schedule
  - individual_prescription
  - unresolvable_investigational_drug
  - non_pdac_regimen_observed_only
  - outcome_optimized_or_best_treatment_label
  - patient_level_candidate_assignment
evidence_sources:
  - source_id: nci_pdq_pancreatic_treatment_2025
    source_type: clinical_guideline_summary
    title: Pancreatic Cancer Treatment (PDQ) - Health Professional Version
    organization_or_journal: National Cancer Institute
    publication_date: '2025-02-12'
    version_or_update_date: '2025-02-12'
    url_or_doi: https://www.cancer.gov/types/pancreatic/hp/pancreatic-treatment-pdq
    access_date: '2026-08-15'
    supported_claim: Advanced or metastatic PDAC systemic treatment evidence, FOLFIRINOX, NALIRIFOX, gemcitabine combinations, second-line chemotherapy, and olaparib maintenance context.
  - source_id: fda_onivyde_first_line_pdac_2024
    source_type: regulatory_approval
    title: FDA approves irinotecan liposome for first-line treatment of metastatic pancreatic adenocarcinoma
    organization_or_journal: U.S. Food and Drug Administration
    publication_date: '2024-02-13'
    version_or_update_date: '2024-02-13'
    url_or_doi: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-approves-irinotecan-liposome-first-line-treatment-metastatic-pancreatic-adenocarcinoma
    access_date: '2026-08-15'
    supported_claim: NALIRIFOX has a first-line metastatic pancreatic adenocarcinoma indication and randomized NAPOLI 3 evidence.
  - source_id: fda_bizengri_nrg1_pdac_2024
    source_type: regulatory_approval
    title: FDA grants accelerated approval to zenocutuzumab-zbco for non-small cell lung cancer and pancreatic adenocarcinoma
    organization_or_journal: U.S. Food and Drug Administration
    publication_date: '2024-12-04'
    version_or_update_date: '2024-12-04'
    url_or_doi: https://www.fda.gov/drugs/resources-information-approved-drugs/fda-grants-accelerated-approval-zenocutuzumab-zbco-non-small-cell-lung-cancer-and-pancreatic
    access_date: '2026-08-15'
    supported_claim: Zenocutuzumab has an accelerated indication for advanced unresectable or metastatic pancreatic adenocarcinoma with an NRG1 fusion after prior systemic therapy.
  - source_id: fda_keytruda_msi_h_dmmr_2017
    source_type: regulatory_approval
    title: FDA approval package for pembrolizumab MSI-H or dMMR solid tumors
