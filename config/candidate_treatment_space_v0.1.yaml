    access_date: '2026-08-15'
    supported_claim: Trastuzumab deruxtecan has an accelerated indication for previously treated unresectable or metastatic HER2-positive IHC3+ solid tumors.
  - source_id: fda_ntrk_repotrectinib_2024
    source_type: regulatory_approval
    title: FDA grants accelerated approval to repotrectinib for NTRK gene fusion-positive solid tumors
    organization_or_journal: U.S. Food and Drug Administration
    publication_date: '2024-06-13'
    version_or_update_date: '2024-06-13'
