    access_date: '2026-08-15'
    supported_claim: Selpercatinib has a tissue-agnostic RET fusion-positive solid tumor indication after prior systemic treatment or when no satisfactory alternatives exist.
  - source_id: fda_braf_dabrafenib_trametinib_2022
