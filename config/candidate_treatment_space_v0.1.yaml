    access_date: '2026-08-15'
    supported_claim: Repotrectinib has an accelerated tissue-agnostic NTRK fusion-positive solid tumor indication after progression or when no satisfactory alternative exists.
  - source_id: fda_ret_selpercatinib_2026
    source_type: regulatory_approval
