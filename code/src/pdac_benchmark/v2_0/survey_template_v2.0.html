<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>病例 01 · 治疗方案标签审核</title>
<style>
:root{--ink:#183431;--muted:#607671;--accent:#146759;--line:#dce6e1;--paper:#fff;--bg:#f3f6f3;--warm:#f8f2e5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:16px;line-height:1.75}button,input,select,textarea{font:inherit}button,summary,label.choice,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent);text-underline-offset:3px;overflow-wrap:anywhere}.top{background:#173f37;color:#fff;padding:14px max(20px,calc((100% - 800px)/2));font-size:13px;letter-spacing:1px}.top span{float:right;opacity:.8}main{max-width:800px;margin:auto;padding:26px 20px 130px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}h1{font-size:30px;line-height:1.4;letter-spacing:-.7px;margin:6px 0 14px}h2{font-size:20px;line-height:1.5;margin:0 0 16px}h3{font-size:16px;margin:20px 0 8px}.subtitle,.muted{color:var(--muted);font-size:14px}.intro{margin:0 0 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:23px;margin:18px 0}.section-no{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;background:#e9f1ed;border-radius:8px;margin-right:9px;font-size:13px;color:var(--accent)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.fact b{display:block;font-size:12px;font-weight:400;color:var(--muted)}.fact span{font-size:16px;font-weight:600}.fact.full{grid-column:1/-1}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.badge{display:inline-block;background:#eaf2ef;border-radius:6px;padding:3px 9px;font-size:12px}.badge.research{background:#f4ebfa;color:#705088}.notice{border-left:3px solid #bb9c5a;padding:10px 14px;background:var(--warm);font-size:13px}.timeline{border-left:2px solid #d8e4dd;padding-left:18px;margin:12px 0}.timeline p{margin:6px 0}.day{font-size:13px;font-weight:700;color:var(--accent)}details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-size:14px;font-weight:600;min-height:32px}details p{font-size:14px}.specimen{padding:10px 0;border-bottom:1px dotted var(--line);font-size:14px}.specimen:last-child{border:0}.specimen b{font-size:13px}.source{color:var(--muted);font-size:11px;overflow-wrap:anywhere;margin-top:9px}.gene{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:5px 9px;margin:3px;font-size:14px}.lineitem{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.lineitem:last-child{border:0}.evidence{font-size:14px;border-left:2px solid #cadacf;padding:8px 14px;margin:12px 0}.evidence p{margin:5px 0}.proposal{background:#eef4f0;padding:18px;border-radius:12px;margin:16px 0}.proposal small{font-size:12px;color:var(--muted);display:block}.proposal strong{font-size:21px}.proposal p{font-size:14px;margin:9px 0 0}.conditions{font-size:14px;padding-left:22px}.choice{display:flex;gap:12px;align-items:flex-start;padding:14px 12px;border:1px solid var(--line);border-radius:10px;margin:9px 0;cursor:pointer;min-height:54px}.choice:has(input:checked){background:#edf6f1;border-color:var(--accent)}input[type=radio]{accent-color:var(--accent);width:18px;height:18px;margin-top:5px;flex-shrink:0}.choice small{display:block;color:var(--muted);font-size:12px}select,textarea{width:100%;padding:12px;border:1px solid #c5d6cc;border-radius:8px;background:#fff;color:var(--ink);min-height:48px}textarea{min-height:100px;resize:vertical}label.field{display:block;font-size:14px;font-weight:600;margin:14px 0 7px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.button{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:12px 20px;font-weight:600;min-height:48px}.button.secondary{background:#edf1ec;color:var(--ink);border:1px solid #d5dfd6}.textbutton{background:transparent;border:0;text-decoration:underline;color:var(--accent);padding:6px 0;font-size:13px}.footer{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid var(--line);backdrop-filter:blur(12px);z-index:3;padding:12px 20px max(12px,env(safe-area-inset-bottom))}.footer-inner{max-width:754px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.footstatus{font-size:12px;color:var(--muted);margin-bottom:5px}.progress{height:4px;border-radius:3px;background:#dfe8e1;overflow:hidden;margin-top:12px}.progress div{height:100%;background:var(--accent);transition:width .2s}.steps{display:flex;gap:7px;margin:20px 0 8px;flex-wrap:wrap}.step{width:35px;height:35px;border-radius:50%;background:white;border:1px solid var(--line);color:var(--muted);font-size:12px}.step.active{background:var(--accent);color:white}.step.done{border-color:var(--accent);color:var(--accent);background:#e9f3ec}.error{color:#973e2d;font-size:14px;margin:8px 0;min-height:20px}.reviewrow{padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}.reviewrow strong{display:block}.reviewrow button{float:right}.mini{font-size:12px}.patient-recap{margin:0 0 18px;background:#e9efea;padding:10px 14px;border-radius:9px;font-size:13px}.separator{height:1px;background:var(--line);margin:24px 0}.empty{display:none}#toast{font-size:13px;color:var(--accent)}:focus-visible{outline:3px solid #b28a33;outline-offset:3px}fieldset{border:0;padding:0;margin:0;min-width:0}legend{font-weight:600;margin:8px 0;font-size:16px}
.steps{flex-wrap:nowrap}.step{flex:1;min-width:0;max-width:35px}
@media(max-width:520px){main{padding:22px 16px 140px}.card{padding:18px;margin:15px 0;border-radius:13px}h1{font-size:26px}.top{padding:12px 16px}h2{font-size:18px}.footer{padding-left:16px;padding-right:16px}.button{padding:11px 16px}.facts{gap:12px}.footstatus{font-size:11px}h1.drug{font-size:25px}.footer-inner{gap:8px}}
@media print{.footer,.top,.steps,.button,.textbutton{display:none}main{padding:0;max-width:none}.card{break-inside:avoid}body{background:white}}
</style></head>
<body><header class="top">胰腺癌 · 治疗方案标签审核<span>v2.0</span></header><main id="app"></main><footer class="footer"><div class="footer-inner"><div><div class="footstatus" id="status"></div><button class="textbutton" id="case-link" type="button">查看病例资料</button></div><div class="row"><button class="button secondary" id="back" type="button">上一步</button><button class="button" id="next" type="button">开始审核</button></div></div></footer>
<script id="survey-data" type="application/json">__SURVEY_DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('survey-data').textContent), app=document.getElementById('app');
let page=0, reviewer='', answers={}, caseComment='', returnPage=null, storageOK=true;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=()=>D.form_version+':'+reviewer;
const facts=xs=>xs.map(x=>`<div class="fact"><b>${esc(x.label)}</b><span>${esc(x.value)}</span></div>`).join('');
const factline=xs=>xs.map(x=>`${esc(x.label)}：${esc(x.value)}`).join('；');
const src=s=>`<div class="source">来源：${esc(s.file)} · 行 ${esc(s.row)}</div>`;
const count=()=>D.pairs.filter(p=>valid(answers[p.pair_id],p)).length;
function valid(a,p){return !!a && (a.action==='agree'||a.action==='defer'||(a.action==='change'&&D.labels[a.label]&&a.label!==p.proposed_label&&a.reason?.trim()));}
function save(){if(!reviewer)return;try{localStorage.setItem(key(),JSON.stringify({form_version:D.form_version,answers,caseComment,page,updated_at:new Date().toISOString()}));storageOK=true;}catch(e){storageOK=false;}updateFooter();}
function load(){answers={};caseComment='';try{const s=JSON.parse(localStorage.getItem(key())||'null');if(s?.form_version===D.form_version){answers=s.answers||{};caseComment=s.caseComment||'';}storageOK=true;}catch(e){storageOK=false;}}
function steps(){return `<nav class="steps" aria-label="审核进度"><button class="step ${page===0?'active':''}" data-go="0" aria-label="病例资料">例</button>${D.pairs.map((p,i)=>`<button class="step ${page===i+1?'active':valid(answers[p.pair_id],p)?'done':''}" data-go="${i+1}" aria-label="方案 ${i+1}">${i+1}</button>`).join('')}<button class="step ${page===8?'active':''}" data-go="8" aria-label="核对结果">核</button></nav>`;}
function pathHTML(){return D.pathology.map((p,i)=>`<details><summary>D${p.day} · ${esc(p.method)} · ${p.specimens.length} 个标本</summary>${p.specimens.map(s=>`<div class="specimen"><b>标本 ${s.number}</b><br>${factline(s.facts)}</div>`).join('')}${src(p.source)}</details>`).join('');}
function caseHTML(){const recent=D.clinical_events.filter(e=>e.kind==='影像评估').slice(-1);const markers=D.clinical_events.filter(e=>e.kind==='肿瘤标志物').slice(-2);return `
<div class="eyebrow">PILOT / 病例 01</div><h1>治疗方案标签审核</h1><p class="subtitle intro">请依据病例资料和所列证据，逐项审核 7 个候选方案的预拟标签。</p>
<div class="notice">交互样稿 · 答案仅保存在本机，可下载核对；本页不在线提交。</div>
<div class="card"><label class="field" for="reviewer">专家编号</label><select id="reviewer"><option value="">请选择</option><option value="A" ${reviewer==='A'?'selected':''}>专家 A</option><option value="B" ${reviewer==='B'?'selected':''}>专家 B</option></select><p class="muted">每位专家独立填写一份。可逐例完成，无需一次审核全部病例。</p></div>
<section class="card" id="clinical"><h2><span class="section-no">01</span>病例概况</h2><div class="facts">${facts(D.summary)}</div><div class="separator"></div><div class="facts"><div class="fact"><b>审核时点</b><span>D${D.t0_day}</span></div><div class="fact"><b>NGS 报告日</b><span>D${D.ngs_reports[0].day}</span></div></div><p class="muted">D0 为首次目标癌症诊断日。请评价 D${D.t0_day} 时点下的方案匹配关系。</p></section>
<section class="card"><h2><span class="section-no">02</span>病理资料</h2><p class="muted">6 份取材记录 · 12 个标本。下列日期为取材日，不推定报告签发时间。</p><div class="timeline"><p><span class="day">D0</span> 胰头活检：4 个标本记录腺癌 NOS；另有 2 个胰头标本及 1 个十二指肠标本记录浸润性肿瘤“否”。</p><p><span class="day">D11</span> 肝组织病理与细胞学均记录腺癌 NOS，癌种登记为胰腺癌。</p><p><span class="day">D52 / D53 / D115</span> 腹水细胞学的浸润性肿瘤字段分别为“否／是／否”；D53 记录腺癌 NOS。</p></div>${pathHTML()}</section>
<section class="card"><h2><span class="section-no">03</span>既往系统治疗</h2>${D.prior_treatments.map(r=>`<div class="lineitem"><span>${esc(r.name)}</span><strong>${esc(r.dates)}</strong></div>`).join('')}<p class="muted">按各药物实际起止日展示；伊立替康从 D66 开始。</p></section>
<section class="card"><h2><span class="section-no">04</span>分子检测</h2><p class="muted">D${D.ngs_reports[0].day} · ${esc(D.ngs_reports[0].panel)}</p><div>${D.variants.map(v=>`<span class="gene">${esc(v.gene)} ${esc(v.protein)}</span>`).join('')}</div>${D.cna.length?`<p>离散拷贝数原始编码：${D.cna.map(v=>esc(v.gene)+'='+esc(v.value)).join('；')}。</p>`:''}<details><summary>查看变异原始注释与来源</summary>${D.variants.map(v=>`<div class="specimen"><b>${esc(v.gene)} ${esc(v.protein)}</b><p>${factline(v.details)}</p>${src(v.source)}</div>`).join('')}<p class="muted">记录中的基因改变及原始注释不自动等同于致病性或胚系判定。</p></details></section>
<section class="card"><h2><span class="section-no">05</span>最近评估</h2>${recent.concat(markers).map(e=>`<div class="timeline"><span class="day">D${e.day} · ${esc(e.kind)}</span><p>${factline(e.facts)}</p></div>`).join('')}<details><summary>查看时点前的全部评估与标志物记录</summary>${D.clinical_events.map(e=>`<div class="specimen"><b>D${e.day} · ${esc(e.kind)}</b><p>${factline(e.facts)}</p>${src(e.source)}</div>`).join('')}</details></section>
<section class="card"><h2>审核说明</h2><p>先阅读预拟标签与理由，再选择同意、修改或暂无法审核。所有选项均不预选。</p><details><summary>四类标签如何区分</summary><p><b>支持匹配：</b>所评价路径有证据支持，关键匹配条件得到现有资料支持。</p><p><b>条件性匹配：</b>有可支持的路径，但仍需核实明确的关键条件。</p><p><b>有依据不匹配：</b>现有资料与该路径存在明确冲突。</p><p><b>无法判定：</b>证据或病例资料不足以确定匹配关系，或存在未解决的解释分歧。</p><p>“暂无法审核”是填写状态，表示本项尚未作出标签判断。</p></details><p class="muted">知识截止日 ${D.evidence_cutoff} · 样稿日期 ${D.compiled_date}</p></section>`;}
function questionHTML(p,i){const a=answers[p.pair_id]||{};return `<div class="eyebrow">方案 ${i} / 7 · ${esc(p.pair_id)}</div><h1 class="drug">${esc(p.regimen_display_name)}</h1><div class="patient-recap">病例 01 · 66 岁 · 男 · 初诊 IV 期 · 审核时点 D122</div><div class="badges"><span class="badge ${p.use_context==='research'?'research':''}">${p.use_context==='research'?'研究性方案':'常规使用情境'}</span></div><section class="card"><h2>预拟判断</h2><div class="proposal"><small>预拟标签</small><strong>${esc(p.proposed_label_zh)}</strong><p>${esc(p.rationale)}</p></div><h3>评价路径</h3><p>${esc(p.assessment_context)}</p>${p.unknown_conditions.length?'<h3>标签成立需确认的条件</h3><ul class="conditions">'+p.unknown_conditions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}${p.unmet_conditions.length?'<h3>已知冲突</h3><ul class="conditions">'+p.unmet_conditions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}<details><summary>查阅证据与原文（${p.evidence_ids.length} 条）</summary>${p.evidence_ids.map(id=>{const e=D.evidence.find(x=>x.evidence_id===id);return `<div class="evidence"><b>${esc(id)} · ${esc(e.publication_date)}</b><p>${esc(e.finding_zh)}</p><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a><p class="muted">定位：${esc(e.locator)}</p></div>`;}).join('')}</details></section>
<section class="card"><fieldset><legend>您对该预拟标签的判断</legend>${[['agree','同意预拟标签',p.proposed_label_zh],['change','修改标签','选择新的标签，并简述理由'],['defer','暂无法审核','保留本项，之后再判断']].map(([v,t,s])=>`<label class="choice"><input type="radio" name="action" value="${v}" ${a.action===v?'checked':''}><span>${t}<small>${esc(s)}</small></span></label>`).join('')}</fieldset><div id="change-fields" ${a.action==='change'?'':'hidden'}><label class="field" for="label">修改后的标签</label><select id="label"><option value="">请选择</option>${Object.entries(D.labels).filter(([k])=>k!==p.proposed_label).map(([k,v])=>`<option value="${k}" ${a.label===k?'selected':''}>${v}</option>`).join('')}</select></div><label class="field" for="reason" id="reason-title">${a.action==='change'?'修改理由（必填）':'补充意见（选填）'}</label><textarea id="reason" placeholder="可说明病例事实、适用条件或证据上的理由。">${esc(a.reason||'')}</textarea><details><summary>方案属性修订（选填）</summary><label class="field" for="context">如需修订上方使用情境，请选择</label><select id="context"><option value="">不作修订</option>${[['routine','常规使用情境'],['research','研究性方案'],['unresolved','需进一步核实']].map(([k,v])=>`<option value="${k}" ${a.context===k?'selected':''}>${v}</option>`).join('')}</select></details><div id="error" class="error" role="alert"></div></section>`;}
function reviewHTML(){return `<div class="eyebrow">PILOT / 核对结果</div><h1>本例审核汇总</h1><p class="subtitle">专家 ${esc(reviewer)} · 已填写 ${count()} / 7 项</p><section class="card">${D.pairs.map((p,i)=>{const a=answers[p.pair_id]||{};return `<div class="reviewrow"><button class="textbutton" data-go="${i+1}">修改</button><strong>${i+1}. ${esc(p.regimen_display_name)}</strong><span>${a.action==='agree'?'同意 · '+esc(p.proposed_label_zh):a.action==='change'?'修改为 · '+esc(D.labels[a.label]||'尚未选择'):a.action==='defer'?'暂无法审核':'尚未填写'}</span>${a.reason?'<p>'+esc(a.reason)+'</p>':''}</div>`;}).join('')}<label class="field" for="case-comment">病例补充意见（选填）</label><textarea id="case-comment" placeholder="可补充病理解释、遗漏方案或其他意见。">${esc(caseComment)}</textarea></section><div class="notice">本页为试填样稿。点击“下载试填结果”保存到本机，不会向任何平台或专家提交。暂无法审核的项目保留空标签。</div><div id="error" class="error" role="alert"></div><p id="toast" role="status"></p><button class="textbutton" id="reset" type="button">清除当前专家的本例试填记录</button>`;}
function updateFooter(){document.getElementById('status').textContent=(reviewer?'专家 '+reviewer+' · ':'')+count()+'/7 项已填写'+(reviewer?(storageOK?' · 本机已保存':' · 本机保存不可用'):'');document.getElementById('back').hidden=page===0;document.getElementById('case-link').hidden=page===0;document.getElementById('next').textContent=page===0?(returnPage?'返回审核':'开始审核'):page===8?'下载试填结果':page===7?'核对结果':'下一项';}
function render(){app.innerHTML=steps()+(page===0?caseHTML():page===8?reviewHTML():questionHTML(D.pairs[page-1],page));updateFooter();app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
if(page===0){document.getElementById('reviewer').onchange=e=>{reviewer=e.target.value;returnPage=null;load();render();};}
else if(page<=7){const p=D.pairs[page-1];app.querySelectorAll('input[name=action],#label,#reason,#context').forEach(el=>el.addEventListener(el.tagName==='TEXTAREA'?'input':'change',()=>{const a=answers[p.pair_id]||{};a.action=app.querySelector('input[name=action]:checked')?.value||'';a.label=document.getElementById('label').value;a.reason=document.getElementById('reason').value;a.context=document.getElementById('context').value;answers[p.pair_id]=a;document.getElementById('change-fields').hidden=a.action!=='change';document.getElementById('reason-title').textContent=a.action==='change'?'修改理由（必填）':'补充意见（选填）';document.getElementById('error').textContent='';save();}));}
else{document.getElementById('case-comment').oninput=e=>{caseComment=e.target.value;save();};document.getElementById('reset').onclick=()=>{if(confirm('清除当前专家的本例试填记录？')){try{localStorage.removeItem(key());}catch(e){}answers={};caseComment='';page=0;render();window.scrollTo(0,0);}};}}
function go(n){if(n>0&&!reviewer){page=0;render();document.getElementById('reviewer').focus();return;}page=n;render();window.scrollTo(0,0);}
document.getElementById('case-link').onclick=()=>{returnPage=page;go(0);};
document.getElementById('back').onclick=()=>go(Math.max(0,page-1));
document.getElementById('next').onclick=()=>{if(page===0){if(!reviewer){document.getElementById('reviewer').focus();return;}const n=returnPage||1;returnPage=null;go(n);}else if(page<8){const p=D.pairs[page-1];if(!valid(answers[p.pair_id],p)){document.getElementById('error').textContent='请选择判断；修改标签时，请同时选择新标签并填写理由。';document.getElementById('error').scrollIntoView({block:'center'});return;}go(page+1);}else{if(count()!==7){document.getElementById('error').textContent='请完成全部项目，或将需要稍后判断的项目标为“暂无法审核”。';return;}const record={form_version:D.form_version,mode:'preview_only',case_id:D.case_id,reviewer_id:reviewer,exported_at:new Date().toISOString(),case_comment:caseComment,reviews:D.pairs.map(p=>{const a=answers[p.pair_id];return {pair_id:p.pair_id,action:a.action,proposed_label:p.proposed_label,reviewed_label:a.action==='agree'?p.proposed_label:a.action==='change'?a.label:null,review_status:a.action==='defer'?'deferred':'reviewed',reason:a.reason||'',context_correction:a.context||null};})};const blob=new Blob([JSON.stringify(record,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=D.case_id+'_expert_'+reviewer+'_preview_v2.0.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('toast').textContent='试填结果已生成下载；未在线提交。';}};
render();
</script></body></html>
