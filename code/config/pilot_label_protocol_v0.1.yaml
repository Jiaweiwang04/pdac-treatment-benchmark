version: v0.1
status: draft_not_locked
purpose: >-
  Validate the evidence-and-constraint label contract on a small private sample
  before any full patient-candidate training table is created.

scope:
  cohort_name: Strict Extended
  cohort_definition_path: code/config/cohort_definition_v0.1.yaml
  required_cohort_version: v0.1.3.1
  candidate_space_path: code/config/candidate_treatment_space_v0.1.yaml
  required_candidate_space_version: v0.1.1
  candidate_pool_field: main_candidate_pool
  label_schema_path: code/config/evidence_constraint_label_schema_v0.1.yaml
  required_label_schema_version: v0.1
  track: Track A

sample:
  target_decision_points: 24
  minimum_decision_points: 20
  maximum_decision_points: 30
  stable_hash_namespace: pdac-pilot-label-v0.1
  unique_key: [cohort, record_id, ca_seq, t0_start_day]
  assignment_policy: first_available_priority_stratum_without_replacement
  strata:
    - name: actionable_fusion_signal
      target_n: 4
    - name: pre_t0_msi_or_mmr_report
      target_n: 4
    - name: tumor_brca_signal_not_germline
      target_n: 4
    - name: prior_folfirinox
      target_n: 4
    - name: prior_gemcitabine_based
      target_n: 4
    - name: no_prior_advanced_regimen
      target_n: 4
    - name: prior_mapping_uncertain
      target_n: 4
    - name: deterministic_fill
      target_n: 24

time_policy:
  t0_field: dx_reg_start_int
  ngs_report_rule: index_ngs_report_day_strictly_less_than_t0
  same_day_ngs: excluded
  pathology_report_time_conversion: biomarker_prepaint_minus_dob_ca_dx_days
  pathology_report_rule: converted_report_day_strictly_less_than_t0
  prior_regimen_rule: regimen_start_day_strictly_less_than_t0
  prior_advanced_regimen_rule: >-
    regimen_start_day greater_than_or_equal_to advanced_evidence_day and
    strictly_less_than_t0
  post_t0_fields_allowed: false

evidence_policy:
  selected_ngs_sample_only: true
  linked_pathology_report_only: true
  positive_somatic_signal_may_satisfy_matching_somatic_biomarker: true
  absent_somatic_call_means_negative: false
  tumor_brca_means_germline_brca: false
  generic_sv_gene_involvement_means_actionable_fusion: false
  fusion_text_confirmation_required: true
  msi_or_mmr_negative_policy: manual_review_not_hard_negative
  tmb_h_status: unavailable_unknown
  her2_ihc_3_plus_status: unavailable_unknown
  track_b_status: frozen_unavailable
  missing_track_b_means_clinically_cleared: false

label_policy:
  label_origin: rule_derived
  review_status: not_reviewed
  clinical_clearance_status: not_assessed_track_b_frozen
  observed_next_regimen_is_gold_standard: false
  outcome_is_primary_label: false
  current_t0_regimen_allowed_in_label_derivation: false
  current_t0_regimen_allowed_in_model_features: false
  candidate_evidence_status_mapping:
    supported_by_accessible_sources: supported
    supported_with_conflicting_or_lower_level_evidence: conditional
    phase_3_no_overall_survival_benefit_with_pfs_or_response_signal: conditional

review_contract:
  required_roles: [clinical_reviewer_1, clinical_reviewer_2, adjudicator_if_disagreement]
  permissible_review_labels: [consider, conditional_review, exclude, insufficient_evidence]
  required_review_fields:
    - reviewer_1_label
    - reviewer_1_reason
    - reviewer_2_label
    - reviewer_2_reason
    - adjudicated_label
    - adjudication_reason
    - review_status
  freeze_policy: no_label_or_medical_conclusion_is_frozen_by_the_generator

review_strategy:
  plan_a:
    name: expert_double_review_primary
    priority: primary
    scope: all_24_pilot_cases_crossed_with_all_main_pool_candidates
    completion_rule: two_independent_reviews_and_adjudication_of_disagreements
    resulting_label_name: expert_adjudicated_evidence_constraint_label
  plan_b:
    name: frozen_guideline_rulebook_fallback
    priority: secondary_only_if_plan_a_is_not_available
    activation_requires: documented_project_lead_or_supervisor_approval
    source_order:
      - frozen_clinical_guideline
      - current_regulatory_label
      - candidate_specific_primary_evidence
    resulting_label_name: guideline_evidence_eligibility
    prohibited_claims:
      - clinical_appropriateness
      - best_treatment
      - treatment_recommendation
      - track_b_clinical_clearance
    conflict_policy: unresolved_source_conflict_becomes_manual_review_or_insufficient_evidence

outputs:
  private_directory: data/processed/evidence_constraint_labels/pilot_v0.1
  private_decision_points: pilot_decision_points.csv
  private_patient_candidate_rows: pilot_patient_candidate_rows.csv
  private_case_linkage: pilot_case_linkage.csv
  private_reviewer_case_index: pilot_reviewer_case_index.csv
  private_review_template: pilot_review_template.csv
  public_summary_table: code/results/reports/tables/pilot_label_validation_summary_v0.1.csv
  public_report: code/results/reports/pilot_label_validation_report_v0.1.md
  public_identifier_columns_allowed: []
  public_small_cell_threshold: 5

completion_criteria:
  - private_decision_point_count_between_20_and_30
  - every_decision_point_crossed_with_every_main_candidate
  - all_ngs_and_pathology_evidence_strictly_pre_t0
  - no_current_t0_regimen_or_outcome_used_in_label_derivation
  - no_identifier_in_public_outputs
  - all_public_counts_between_1_and_4_suppressed
  - rule_derived_rows_explicitly_marked_not_reviewed
  - clinical_double_review_and_adjudication_remain_pending
