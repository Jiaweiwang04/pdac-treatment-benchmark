version: v0.1
status: draft_not_locked
materialization_status: design_only_not_materialized
task: track_a_patient_candidate_ranking_dataset
purpose: define training-ready dataset contracts without generating patient-level rows, freezing splits, or starting model training

authoritative_inputs:
  cohort_definition:
    path: code/config/cohort_definition_v0.1.yaml
    required_version: v0.1.3.1
  candidate_space:
    path: code/config/candidate_treatment_space_v0.1.yaml
    required_version: v0.1.1
    candidate_pool: main_candidate_pool
  label_schema:
    path: code/config/evidence_constraint_label_schema_v0.1.yaml
    required_version: v0.1
  candidate_regimen_crosswalk:
    path: code/results/mappings/candidate_regimen_crosswalk_v0.1.csv
    role: observed_regimen_alignment_only

candidate_space_4_1_1_verification:
  version: v0.1.1
  status: technical_repairs_verified_medical_freeze_pending
  checks:
    ntrk_agents_are_mutually_exclusive_single_agents: pass
    folfox_or_off_is_conditional_main_pool: pass
    gemcitabine_paclitaxel_after_folfirinox_is_conditional_main_pool: pass
    nci_pdq_is_evidence_summary_not_guideline: pass
    regulatory_sources_are_claim_specific: pass
    adenosquamous_inherits_cohort_manual_review: pass

development_invariants:
  cohort_name: Strict Extended
  decision_point_count: 557
  main_candidate_count: 16
  expected_patient_candidate_rows: 8912
  expected_row_count_formula: decision_point_count_times_main_candidate_count
  cohort_membership_is_endpoint_independent: true
  candidate_space_is_not_medically_frozen: true

dataset_contracts:
  decision_point_dataset:
    status: source_available_private_output_not_materialized_for_training
    role: one_locked_pre_t0_pdac_decision_context
    proposed_path: data/processed/training_ready/v0.1/decision_points.csv
    grain: one_locked_pdac_t0_decision_point
    primary_key: [cohort, record_id, ca_seq]
    required_time_fields: [t0_regimen_start_day, index_ngs_report_day, advanced_evidence_day]
    public_output_allowed: false
  candidate_master:
    status: available_as_versioned_configuration
    role: candidate_identity_evidence_and_condition_definition
    source_path: code/config/candidate_treatment_space_v0.1.yaml
    grain: one_candidate
    primary_key: [candidate_id]
    selected_pool: main_candidate_pool
    public_output_allowed: true
  patient_candidate_dataset:
    status: not_generated
    role: feature_only_training_subject_table
    proposed_path: data/processed/training_ready/v0.1/patient_candidate_features.csv
    grain: one_locked_pdac_t0_candidate_pair
    primary_key: [cohort, record_id, ca_seq, candidate_id]
    construction: strict_extended_decision_points_cross_main_candidate_pool
    embedded_label_families: []
    public_output_allowed: false
  observed_regimen_labels:
    status: source_available_not_training_gold_standard
    role: auxiliary_observational_proxy
    proposed_path: data/processed/training_ready/v0.1/observed_regimen_labels.csv
    grain: one_locked_pdac_t0_decision_point
    primary_key: [cohort, record_id, ca_seq]
    column_namespace: observed__
    formal_target_eligible: false
    public_output_allowed: false
  evidence_constraint_labels:
    status: pilot_rule_derived_full_table_not_generated
    role: primary_candidate_ranking_target
    proposed_path: data/processed/training_ready/v0.1/evidence_constraint_labels.csv
    grain: one_locked_pdac_t0_candidate_pair
    primary_key: [cohort, record_id, ca_seq, candidate_id]
    column_namespace: evidence__
    formal_target_eligible_origins: [expert_adjudicated, supervisor_approved_frozen_guideline_rulebook]
    development_only_origins: [rule_derived_not_reviewed]
    public_output_allowed: false
  outcome_dataset:
    status: endpoint_fields_available_separate_dataset_not_generated
    role: secondary_survival_analyses_only
    proposed_path: data/processed/training_ready/v0.1/outcome_labels.csv
    grain: one_locked_pdac_t0_decision_point
    primary_key: [cohort, record_id, ca_seq]
    column_namespace: outcome__
    allowed_endpoints: [os_post_t0_validated, pfs_i_post_t0_validated, pfs_m_post_t0_validated]
    formal_candidate_classification_target_eligible: false
    public_output_allowed: false
  split_manifest:
    status: not_generated_not_frozen
    role: future_patient_grouped_train_validation_test_assignment
    proposed_path: data/processed/training_ready/v0.1/split_manifest.csv
    grain: one_patient
    primary_key: [cohort, record_id]
    column_namespace: split__
    propagation_rule: every_decision_point_and_candidate_row_for_one_patient_inherits_one_split
    public_output_allowed: false

feature_policy:
  allowed_track_a_groups:
    - locked_pdac_instance_mapping
    - advanced_status_strictly_pre_t0
    - selected_ngs_report_strictly_pre_t0
    - biomarker_results_available_from_selected_pre_t0_ngs
    - prior_treatment_components_strictly_pre_t0
    - prior_line_and_exposure_context_strictly_pre_t0
    - candidate_identity_and_pre_frozen_evidence_attributes
    - candidate_track_a_condition_requirements
  linkage_only_fields: [cohort, record_id, ca_seq, candidate_id]
  prohibited_model_inputs:
    - patient_or_sample_identifiers
    - observed_next_regimen
    - t0_regimen_drugs
    - post_t0_regimen_or_line
    - os_pfs_ttnt_fields
    - death_or_last_alive_fields
    - follow_up_fields
    - future_ngs_or_biomarker_results
    - review_labels_or_adjudication_notes
  unavailable_track_b_groups:
    - ecog
    - laboratory_values
    - organ_function
    - dose
    - dose_modification
    - toxicity
    - detailed_contraindications
    - drug_interactions

time_policy:
  anchor: t0_regimen_start_day
  feature_availability_rule: strictly_before_t0
  same_day_ngs_policy: unavailable_for_main_track_a_features
  post_t0_feature_policy: prohibited
  outcomes_may_be_joined_as_features: false

label_join_policy:
  default_development_target: evidence_constraint_labels
  observed_labels_join_mode: evaluation_or_descriptive_only
  outcome_labels_join_mode: secondary_survival_analysis_only
  feature_dataset_contains_no_labels: true
  label_origin_and_review_status_required: true

split_policy:
  current_status: design_only_not_generated
  grouping_key: [cohort, record_id]
  candidate_rows_inherit_patient_split: true
  preprocessing_fit_after_split_freeze: true
  split_freeze_required_before_model_training: true
  current_split_is_frozen: false

privacy:
  patient_level_root: data/processed/training_ready/v0.1
  git_status: ignored
  public_release: prohibited
  aggregate_reporting_only: true
  small_count_threshold: 5
  identifiers_are_linkage_only: true

stage_gates:
  patient_candidate_table_generated: false
  train_validation_test_split_frozen: false
  leakage_audit_completed_on_materialized_features: false
  formal_evidence_labels_available: false
  model_training_started: false

